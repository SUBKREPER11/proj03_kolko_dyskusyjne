{% extends "base.html" %}

{% block title %}Logowanie - Kółko dyskusyjne{% endblock %}

{% block content %}
    <div class="card">
        <h1>Zaloguj się</h1>
        <form method="post">
            {% csrf_token %}
            {% include "accounts/_form.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="button">Zaloguj</button>
        </form>
        <p>Nie masz konta? <a href="{% url 'accounts:signup' %}">Zarejestruj się</a>.</p>
    </div>
{% endblock %}
